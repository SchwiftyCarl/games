<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hivefall</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0906;color:#f3e9d8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#lockBtn{position:absolute;right:14px;bottom:26px;width:78px;height:78px;border-radius:50%;border:3px solid #6affb0;background:rgba(10,30,20,.72);color:#6affb0;font-weight:900;font-size:13px;letter-spacing:.05em;line-height:1.15;pointer-events:auto;display:none;touch-action:none;cursor:pointer;z-index:4}
#lockBtn.left{right:auto;left:14px}
#lockBtn.on{background:#6affb0;color:#07200f;box-shadow:0 0 22px rgba(106,255,176,.6)}
#pauseBtn{position:absolute;top:34px;right:8px;width:44px;height:44px;border-radius:10px;border:2px solid #ff8a2b;background:rgba(20,12,6,.75);color:#ff8a2b;font-size:18px;font-weight:800;pointer-events:auto;display:none;cursor:pointer}
.scr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:auto;overflow-y:auto;padding:14px;background:rgba(13,9,6,.95)}
.scr.dim{background:rgba(8,5,3,.55)}
.scr.show{display:flex}
.panel{width:min(100%,720px);margin:auto;text-align:center}
h1{font-size:clamp(38px,9vw,68px);margin:0 0 4px;letter-spacing:.06em;color:#ff8a2b;text-shadow:0 0 24px rgba(255,138,43,.45)}
h1 span{color:#b6f23a}
h2{margin:0 0 10px;font-size:26px;color:#ff8a2b;letter-spacing:.04em}
.sub{color:#b9a98f;margin:0 0 18px;font-size:14px}
.btn{display:block;width:100%;max-width:340px;margin:8px auto;padding:14px 18px;min-height:48px;border-radius:12px;border:2px solid #ff8a2b;background:#2a170a;color:#ffd9b0;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:.03em}
.btn:hover,.btn:focus-visible{background:#47260e;outline:none}
.btn.pri{background:#ff8a2b;color:#1a0d04;font-size:20px;padding:16px 18px}
.btn.pri:hover{background:#ffa14d}
.btn.sm{display:inline-block;width:auto;min-width:120px;margin:6px 5px;padding:10px 14px;font-size:15px}
.btn.off{opacity:.4;cursor:not-allowed}
.btn.lime{border-color:#b6f23a;color:#e8ffb0;background:#1c2a0a}
.help{color:#a89878;font-size:12px;line-height:1.45;margin:12px auto 0;max-width:360px;text-align:left}.help b{color:#f3e9d8}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.coinbar{position:fixed;top:10px;right:14px;font-weight:800;color:#ffd24a;font-size:16px;z-index:5;pointer-events:none;display:none}
.card{background:#1f130a;border:2px solid #6a3a16;border-radius:14px;padding:12px;text-align:left;cursor:pointer;min-height:96px;width:100%}
.card:hover,.card:focus-visible{border-color:#b6f23a;background:#2a1a0c;outline:none}
.card.locked{opacity:.5;cursor:default}
.card.locked:hover{border-color:#6a3a16;background:#1f130a}
.card.sel{border-color:#b6f23a}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
@media(max-width:640px){.cards{grid-template-columns:1fr}.card{min-height:84px}}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:9px;font-weight:900;font-size:14px;color:#10100a;flex:none;border:2px solid rgba(255,255,255,.55)}
.ic.s{width:30px;height:30px;font-size:11px;border-radius:7px}
.cname{font-weight:800;font-size:17px}
.ctag{font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;background:#b6f23a;color:#142004;margin-left:6px}
.ctag.lv{background:#ff8a2b;color:#1a0d04}
.cdesc{font-size:14px;color:#d9c8ac;line-height:1.35}
.cpair{font-size:12px;color:#b6f23a;margin-top:4px}
.keyhint{font-size:11px;color:#8d7d66;float:right}
table.st{width:100%;border-collapse:collapse;margin:8px 0;text-align:left}
table.st td{padding:6px 8px;border-bottom:1px solid #3a2411;font-size:15px}
table.st td:last-child{text-align:right;font-weight:800;color:#ffd9b0}
.shoprow{display:flex;align-items:center;gap:10px;background:#1f130a;border:2px solid #4a2a12;border-radius:12px;padding:8px 12px;margin:7px 0;text-align:left}
.shoprow .t{flex:1}
.shoprow .n{font-weight:800}
.shoprow .d{font-size:13px;color:#cdbb9d}
.pips{display:inline-block;letter-spacing:3px;color:#b6f23a;font-size:13px}
.sbtn{min-width:96px;padding:10px 8px;border-radius:10px;border:2px solid #ffd24a;background:#2a200a;color:#ffd24a;font-weight:800;cursor:pointer;min-height:44px}
.sbtn.off{opacity:.4;border-color:#6a5a2a;cursor:not-allowed}
.big{font-size:44px;font-weight:900;letter-spacing:.05em;margin:0}
.win{color:#b6f23a}.lose{color:#ff5a3a}
.evolist{max-width:380px;margin:4px auto 10px;text-align:left}.evolist div{padding:6px 2px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#a89878}.evolist b{display:block;color:#f3e9d8;font-size:13px}.evolist span{display:block}
.build{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1f130a;border-radius:10px;padding:10px 14px;margin:8px 0;min-height:46px}
.set input[type=range]{width:50%}
.set input[type=checkbox]{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2a0a;border:2px solid #b6f23a;color:#e8ffb0;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center;max-width:90%}
.toast.on{opacity:1}
.dis{font-size:12px;color:#8d7d66;margin-top:14px}
.lock{color:#ff9a6a;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<button id="pauseBtn" aria-label="Pause">II</button>
<button id="lockBtn" aria-label="Lock facing">LOCK<br>AIM</button>
<div class="coinbar" id="coinbar"></div>
<div class="scr" id="scr"></div>
<div class="toast" id="toast"></div>
</div>
<script>
'use strict';
/* ============================================================
   HIVEFALL — single-file survivor game. All balance lives here.
   ============================================================ */
const TUNING = {
  baseRerolls: 3,                          // free rerolls per run (the Reroll Charm in the shop adds more)
  endless: true,                           // ENDLESS MODE: no fixed end; difficulty D = time + build power, depth ticks up forever
  endlessCfg: { depthSec: 50, depthKills: 1000, biomeEvery: 3, bossEvery: 5, surgeEvery: 150, powerDiv: 2.5, timeW: 0.7, powerW: 0.3, shopW: 0.25, xpPerDepth: 0.025, bossHpPerStep: 0.4, depthCoins: 8, firstLapDepth: 15 },
  aimMode: 'auto',                         // 'auto' = weapons target enemies themselves (original spec); 'facing' = fire where you face (+ lock button)
  runLengthSec: 900,                       // 15:00 - the Matriarch spawns
  player: { hp: 100, speed: 165, radius: 14, pickupRadius: 55, contactInvulnSec: 0.4 },
  xpCurve: { base: 5, linear: 4, exponent: 1.7 },
  gemMergeCap: 150,
  maxAliveEnemies: 220,
  enemyPoolSize: 300,                      // 220 cap + surges/minis/props headroom
  spawnRingMin: 60, spawnRingMax: 120,
  spawnMinDist: 300,
  spawnTickSec: 0.5, spawnBatchMax: 4,       // TWEAK: smaller batches (was 8) so refill speed doesn't inflate kills
  catchUpDistance: 900,
  eliteHpMult: 18, eliteSpeedMult: 1.25, eliteDmgMult: 1.5, eliteScale: 2.2,
  worldBossAtSec: 150, worldBreatherSec: 4, worldSurgeAtSec: 90, worldSurgeBase: 20, worldSurgeStep: 10, surgeWarnSec: 2, // WORLDS: 5 x ~3 min, each ends in a boss
  eliteEverySec: 45, eliteFirstSec: 60,    // per world (clock restarts each world)
  coinDropChance: 0.06,
  chestEvolutionFirst: true,
  enemyHitCooldownSec: 0.5, enemyPushbackPx: 10,
  armorMinFraction: 0.25,                  // TWEAK: a hit never drops below 25% of raw (spec: flat min 1)
  victoryBonus: 250,
  skipCoins: 15,                           // TWEAK: spec 10
  feastHeal: 30, purseCoins: 25,
  weight: { owned: 1.2, fresh: 1.0, pair: 1.6 },
  propEverySec: 20, propHp: 12, propHeal: 30,
  magnetOrbChance: 0.05, bombRelicChance: 0.05, chickenChance: 0.25, bombDamage: 60, bossBombFrac: 0.25,
  chestCoins: [30, 50], chestHeal: 20,
  bossHpMult: 1,                           // TWEAK: bosses ignore the clock HP multiplier
  skitterMinShare: 0.4,
  xpScale: 0.2, worldXp: null, worldLevelSec: null, /* original rapid pacing restored; set worldXp/worldLevelSec arrays to re-enable per-world scaling / a steady level drip */ /* front-loaded per world so you have a build early; xpScale is the fallback */                            // TWEAK: global XP gem scale, tuned to the spec's level-pacing targets
  coinScale: 0.3,                          // TWEAK: scales natural coin drops so a win lands near the spec's 700-1,000
  gemValues: { g1: 1, g5: 5, g25: 25 },
  magnetSpeed: 520, magnetAccel: 2600,
  knockbackPx: 6, bigKnockbackFrac: 0.25,
  shakePx: 4, maxDeathPops: 6,
};

// minute marks: [seconds, targetAlive, hpMult, dmgMult]
const CLOCK = [
  [0,25,1.0,1.0],[60,35,1.15,1.0],[120,45,1.3,1.05],[180,55,1.5,1.1],[240,65,1.7,1.15],
  [300,70,2.0,1.2],[360,80,2.3,1.25],[420,90,2.7,1.3],[480,100,3.1,1.35],[540,110,3.6,1.4],
  [600,115,4.2,1.45],[660,125,4.9,1.5],[720,135,5.7,1.55],[780,145,6.6,1.6],[840,155,7.6,1.65],
  [900,90,8.5,1.7]
];

// Enemies: hp/speed/dmg are minute-0 base values. (TWEAK: Leaper speed 138 -> 112 after playtest: felt too fast, and the spec's fairness rule says you should out-run every chaser) xp = XP value dropped (GUESS: 5 -> one blue gem, 25 -> red, else N green gems)
const ENEMIES = {
  skitter: { name:'Scuttler',  hp:8,  sp:72,  dmg:8,  r:13, xp:1, from:0,   w:0,  col:'#7f8c9b', mass:1 },
  darter:  { name:'Leaper',    hp:6,  sp:112, dmg:6,  r:11, xp:1, from:120, w:12, col:'#35d0e8', mass:1 },
  brute:   { name:'Tanker',    hp:65, sp:46,  dmg:16, r:26, xp:10, from:180, w:8,  col:'#b5482e', mass:4 },
  plant:   { name:'Spore Pod', hp:20, sp:0,   dmg:10, r:16, xp:3, from:240, w:5,  col:'#4fbf5a', mass:99 },
  splitter:{ name:'Brood Sac', hp:18, sp:66,  dmg:8,  r:15, xp:1, from:300, w:10, col:'#e8a62c', mass:1 },
  wraith:  { name:'Flyer',     hp:14, sp:92,  dmg:12, r:13, xp:3, from:420, w:10, col:'#b9a4e8', mass:1 },
  charger: { name:'Rammer',    hp:26, sp:58,  dmg:18, r:16, xp:8, from:540, w:8,  col:'#ff7a1f', mass:2 },
  bomber:  { name:'Bloater',   hp:12, sp:84,  dmg:0,  r:13, xp:2, from:660, w:8,  col:'#e8d82c', mass:1 },
  mini:    { name:'Hatchling', hp:3,  sp:118, dmg:4,  r:8,  xp:0, from:9999,w:0,  col:'#e8a62c', mass:1 },
  alpha:   { name:'Alpha Stalker',hp:650,  sp:78, dmg:18, r:32, xp:25, boss:true, col:'#5a6b82', mass:20 },
  spitter: { name:'Spitter',   hp:16, sp:62,  dmg:10, r:13, xp:4, w:0, col:'#9acd32', mass:1 },
  burrower:{ name:'Burrower',  hp:30, sp:70,  dmg:16, r:15, xp:6, w:0, col:'#c28a52', mass:2 },
  screamer:{ name:'Screamer',  hp:24, sp:54,  dmg:8,  r:14, xp:6, w:0, col:'#ff6ad5', mass:1 },
  leech:   { name:'Leech',     hp:18, sp:50,  dmg:6,  r:13, xp:6, w:0, col:'#2aa59a', mass:1 },
  latcher: { name:'Latcher',   hp:22, sp:92,  dmg:5,  r:12, xp:6, w:0, col:'#8f6ad8', mass:1 },
  husk:    { name:'Siege Beetle', hp:1800, sp:52, dmg:24, r:44, xp:25, boss:true, col:'#8a3a22', mass:30 },
  sporemother:{ name:'Sporemother', hp:2800, sp:50, dmg:22, r:46, xp:25, boss:true, col:'#3aa84a', mass:30 },
  brood:   { name:'Broodmother',  hp:5000, sp:60, dmg:26, r:50, xp:25, boss:true, col:'#c9801a', mass:30 },
  horror:  { name:'The Matriarch',hp:11000,sp:66, dmg:32, r:54, xp:25, boss:true, col:'#7a1fa8', mass:40 },
};
const BOSS_COINS = { alpha:[30,30], husk:[40,40], sporemother:[45,45], brood:[50,50], horror:[0,0] };

// NEW_BUGS join the spawn mix from a given sector on and stay forever (so the swarm keeps getting more varied). w = spawn weight.
const NEW_BUGS = [
  { type:'spitter',  sector:2,  w:4, cap:3, note:'Spitters shoot from range. Keep moving.' },
  { type:'screamer', sector:4,  w:3, cap:2, note:'Screamers speed up nearby bugs. Kill them first.' },
  { type:'burrower', sector:6,  w:4, cap:3, note:'Burrowers dig in, then erupt where you were standing.' },
  { type:'leech',    sector:8,  w:4, cap:2, note:'Leeches heal the bugs around them. Hunt them down.' },
  { type:'latcher',  sector:10, w:4, cap:3, note:'Latchers grab on and slow you. Shoot them off!' },
];
// ease-in: a new bug debuts at 25% of its weight and reaches full weight 3 sectors later; its alive-cap grows +1 every 2 sectors (max cap+5)
// health dropped by ordinary bugs: chance per kill by tier (Standard..Extinction), boosted when you are low, with a cooldown.
const HEAL_DROP = { tier:[0.012, 0.007, 0.004, 0.0015, 0], lowBelow:0.5, lowMult:4, highAbove:0.8, highMult:0.5, cd:6, base:8, perMax:0.08, pull:240, eliteExtinction:true };
const NEW_BUG_RAMP = { start: 0.25, perSector: 0.25, capEvery: 2, capMax: 5 };

// TIERS: the fixed difficulty curve. A tier is 5 sectors. Difficulty comes ONLY from how far you climb - never from how strong your build is.
// hp / dmg / spd = multipliers on top of the sector curve; cnt = swarm size multiplier; bonus = credit bonus. Past the table each tier grows by TIER_GROWTH.
const TIERS = [
  { name:'Standard',   hp:1.0, dmg:1.0,  spd:1.00, cnt:1.0,  bonus:0.0, blurb:'The swarm is waking up.' },
  { name:'Hardened',   hp:1.5, dmg:1.35, spd:1.04, cnt:1.1,  bonus:0.2, blurb:'They hit harder. Elites now carry traits.' },
  { name:'Brutal',     hp:2.3, dmg:1.8,  spd:1.08, cnt:1.2,  bonus:0.4, blurb:'Faster, tougher, and meaner.' },
  { name:'Nightmare',  hp:3.5, dmg:2.4,  spd:1.12, cnt:1.3,  bonus:0.6, blurb:'One path will not be enough.' },
  { name:'Extinction', hp:5.2, dmg:3.2,  spd:1.16, cnt:1.4,  bonus:0.8, blurb:'The hive wants you gone.' },
];
const TIER_GROWTH = { hp: 1.5, dmg: 1.25, spd: 1.03, cnt: 1.0, bonus: 1.0 };
const ELITE_TRAITS = { armored: { name:'Armored', col:'#b8c4d8', desc:'takes 35% less damage' }, frenzied: { name:'Frenzied', col:'#ff5a3a', desc:'moves 30% faster' }, splitting: { name:'Splitting', col:'#c8ff3a', desc:'bursts into hatchlings' } };
// WORLDS: a run is five worlds, each ends in a boss. mix = spawn weights; th = ground theme.
const WORLDS = [
  { name:'Hive Surface',   sub:'Scorched ground. They are coming.',     boss:'alpha',       mix:{skitter:10,darter:2},
    th:{ base:'#22110b', line:'rgba(255,150,70,.06)', stone:'#3b2217', crater:'#170a06', bone:'#5a4636', ring:'#3d2012', glow:'#ff7a2a' }, col:'#ffb070' },
  { name:'The Tunnels',    sub:'Tight, dark, and full of Leapers.',     boss:'husk',        mix:{skitter:8,darter:6,brute:3,splitter:3},
    th:{ base:'#14101c', line:'rgba(160,120,255,.07)', stone:'#2a2238', crater:'#0b0810', bone:'#4b4260', ring:'#2a1d3d', glow:'#8a5aff' }, col:'#a98aff' },
  { name:'Fungal Warrens', sub:'Spore pods root the floor. Watch your step.', boss:'sporemother', mix:{skitter:6,darter:3,plant:4,wraith:5,splitter:4},
    th:{ base:'#0f1f12', line:'rgba(120,255,140,.07)', stone:'#24402a', crater:'#08120a', bone:'#6a7a4a', ring:'#1d3a22', glow:'#5aff7a' }, col:'#7aff9a' },
  { name:'Brood Core',     sub:'Rammers and Bloaters. No quiet moments.', boss:'brood',     mix:{skitter:6,brute:5,charger:6,bomber:4,splitter:4},
    th:{ base:'#2a0d10', line:'rgba(255,90,90,.07)', stone:'#4a1c20', crater:'#160506', bone:'#7a5048', ring:'#5a1c1c', glow:'#ff4a4a' }, col:'#ff7a7a' },
  { name:"Queen's Chamber",sub:'Everything the hive has left.',          boss:'horror',     mix:{skitter:5,darter:5,brute:4,wraith:5,charger:5,bomber:4,splitter:4},
    th:{ base:'#1a0d24', line:'rgba(220,120,255,.08)', stone:'#3a2048', crater:'#0f0616', bone:'#8a6aa0', ring:'#4a2260', glow:'#d070ff' }, col:'#e0a0ff' },
];
// One of three is offered after each world boss. pb = run-level bonus bag (stacks).
const WORLD_PERKS = {
  // endless-only repeatable cards (small, always available once your build is full)
  edmg:    { name:'Overdrive',      ab:'OD', col:'#ff5a7a', desc:'+4% damage',          e:true },
  erate:   { name:'Quickfire',      ab:'QF', col:'#ffd84a', desc:'+3% attack speed',    e:true },
  earea:   { name:'Wide Burst',     ab:'WB', col:'#8ae0ff', desc:'+3% area',            e:true },
  emove:   { name:'Light Boots',    ab:'LB', col:'#5affd0', desc:'+3% move speed',      e:true },
  ehp:     { name:'Reinforce',      ab:'RF', col:'#ff7a9a', desc:'+10 Max HP, heal 10', e:true },
  surgeon: { name:'Field Surgeon',  ab:'FS', col:'#ff7a9a', desc:'Heal to full, +15 Max HP' },
  barrels: { name:'Hot Barrels',    ab:'HB', col:'#ff5a7a', desc:'+12% damage' },
  overclk: { name:'Overclock',      ab:'OV', col:'#ffd84a', desc:'+10% attack speed' },
  optics:  { name:'Wide Optics',    ab:'WO', col:'#8ae0ff', desc:'+12% area' },
  servos:  { name:'Servo Boost',    ab:'SB', col:'#5affd0', desc:'+10% move speed' },
  rights:  { name:'Salvage Rights', ab:'SR', col:'#ffd24a', desc:'+15% XP, +40 credits' },
};

const SURVIVORS = {
  warden: { name:'Trooper', start:'pulse',  trait:'+10 Max HP (110 total). The balanced start.', unlock:'Unlocked', col:'#6ad0ff' },
  pyre:   { name:'Flamer',  start:'orbit',  trait:'+10% damage, -10 Max HP (90 total). Glass cannon.', unlock:'Reach level 15 in one run', col:'#ff7a3a' },
  swift:  { name:'Scout',   start:'seeker', trait:'+12% move speed, +15% pickup radius. The gem vacuum.', unlock:'Collect 1,500 cores lifetime', col:'#b6f23a' },
  bulwark:{ name:'Heavy',   start:'aura',   trait:'+2 Armor, +0.4 HP/s regen, -6% move speed. The tank.', unlock:'Survive 10:00 in one run', col:'#c9b27a' },
};

/* ---------- weapons: lv(l) returns stats at level l ---------- */
const b = (c) => c ? 1 : 0;
const WEAPONS = {
  pulse: { name:'Pulse Rifle', ab:'PR', col:'#6ad0ff', pair:'cycler', evo:'railcannon',
    blurb:'Rapid fire at the nearest bug.',
    gain:{2:'+3 damage, faster fire',3:'+3 damage, faster, +1 bolt',4:'+3 damage, faster, bolts pierce',5:'+3 damage, faster, +1 bolt'},
    lv:l=>({ dmg:10+3*(l-1), cd:0.5-0.05*(l-1), n:1+b(l>=3)+b(l>=5), speed:560, pierce:b(l>=4), spread:0.13, assist:0.44 }) },
  orbit: { name:'Orbit Drones', ab:'OD', col:'#ff9a3a', pair:'magnet', evo:'cyclone',
    blurb:'Drones circle you and shred anything they touch.',
    gain:{2:'+4 damage, +1 drone, faster spin',3:'+4 damage, faster spin',4:'+4 damage, +1 drone, faster spin',5:'+4 damage, faster spin, wider orbit'},
    lv:l=>({ dmg:12+4*(l-1), n:2+b(l>=2)+b(l>=4), radius:l>=5?115:95, hitCd:0.35-0.02*(l-1), spin:2.4+0.4*(l-1) }) },
  seeker: { name:'Smart Missiles', ab:'SM', col:'#e86bff', pair:'chip', evo:'swarm',
    blurb:'Homing missiles fan out at nearby bugs.',
    gain:{2:'+2 damage, +1 missile, faster reload',3:'+2 damage, faster reload',4:'+2 damage, +1 missile, faster reload',5:'+2 damage, +1 missile, faster reload'},
    lv:l=>({ dmg:8+2*(l-1), cd:1.0-0.08*(l-1), n:2+b(l>=2)+b(l>=4)+b(l>=5), fan:0.34, range:420, turn:240, speed:330 }) },
  aura: { name:'Shield Pulse', ab:'SP', col:'#7affb0', pair:'plating', evo:'sunwell',

    AU.ctx = new C(); AU.master = AU.ctx.createGain(); AU.master.connect(AU.ctx.destination); auVol();
    const len = AU.ctx.sampleRate; AU.noiseBuf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const d = AU.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AU.ctx = null; }
}
function auVol() { if (AU.master) AU.master.gain.value = SAVE.settings.mute ? 0 : SAVE.settings.vol; }
function tone(f, d, type, v, slide, delay) {
  if (!AU.ctx || SAVE.settings.mute) return;

    const t = AU.ctx.currentTime + (delay || 0), o = AU.ctx.createOscillator(), g = AU.ctx.createGain();

  } catch (e) {}
}

  if (!AU.ctx || SAVE.settings.mute || !AU.noiseBuf) return;

function shopRank(id) { return SAVE.shop[id] || 0; }
function pLevel(run, id) { for (const p of run.passives) if (p.id === id) return p.level; return 0; }

function recalc(run) {
  const S = SURVIVORS[run.sid];
  const pl = (id) => pLevel(run, id);
  const st = run.st || (run.st = {});
  const pb = run.pb || { might: 0, swift: 0, area: 0, move: 0, xp: 0, hp: 0 };
  st.might = 1 + 0.04 * shopRank('might') + 0.08 * pl('overcharge') + (run.sid === 'pyre' ? 0.10 : 0) + pb.might;
  st.swift = 1 + 0.06 * pl('cycler') + pb.swift;
  st.area = 1 + 0.08 * pl('optics') + pb.area;
  st.move = 1 + 0.03 * shopRank('swiftness') + 0.06 * pl('jets') + (run.sid === 'swift' ? 0.12 : 0) - (run.sid === 'bulwark' ? 0.06 : 0) + pb.move;
  st.pickup = 1 + 0.12 * shopRank('magnetism') + 0.25 * pl('magnet') + (run.sid === 'swift' ? 0.15 : 0);
  st.maxhp = TUNING.player.hp + 10 * shopRank('vitality') + 20 * pl('implant') + (run.sid === 'warden' ? 10 : 0) - (run.sid === 'pyre' ? 10 : 0) + 15 * pb.hp;
  st.armor = shopRank('plating') + pl('plating') + (run.sid === 'bulwark' ? 2 : 0);
  st.regen = 0.2 * shopRank('recovery') + 0.15 * pl('plating') + (run.sid === 'bulwark' ? 0.4 : 0);
  st.xpMul = 1 + 0.05 * shopRank('wisdom') + 0.10 * pl('chip') + pb.xp;
  st.coinMul = 1 + 0.06 * shopRank('greed') + 0.10 * pl('chip');
  if (run.player) { const d = st.maxhp - run.player.maxhp; run.player.maxhp = st.maxhp; if (d > 0) run.player.hp += d; run.player.hp = Math.min(run.player.hp, run.player.maxhp); }
}

function drawFx() {
