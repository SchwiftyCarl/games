<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tower Hop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1b3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Tower Hop</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1430;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:#fff;
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
#stage{position:absolute;left:0;top:0;width:420px;height:740px;transform-origin:0 0;overflow:hidden;background:#6fbff7}
#cv{position:absolute;left:0;top:0;width:420px;height:740px;display:block;touch-action:none}
.hidden{display:none!important}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center}
button{font-family:inherit;color:inherit;touch-action:manipulation}

/* generic buttons (all >= 48px tall) */
.btn{min-height:52px;padding:0 24px;border:0;border-radius:18px;font-weight:800;font-size:19px;color:#fff;background:#22346e;
  box-shadow:0 5px 0 #0b1330;cursor:pointer;letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1330}
.btn.big{background:#ff5a3c;box-shadow:0 7px 0 #b3361f;min-height:72px;min-width:250px;font-size:32px;font-weight:900;border-radius:24px;letter-spacing:1px}
.btn.big:active{box-shadow:0 3px 0 #b3361f;transform:translateY(4px)}
.btn.gold{background:#ffc72c;color:#3b2a00;box-shadow:0 5px 0 #b3811a}
.row{display:flex;gap:12px}
.ico{width:48px;height:48px;border:0;border-radius:14px;background:rgba(15,27,61,.62);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ico svg{width:26px;height:26px;fill:#fff}

#btnPause{position:absolute;top:10px;right:10px}
#menu{justify-content:space-between;padding:50px 20px 26px}
#btnMuteM{position:absolute;top:12px;right:12px}
.title{margin:0;text-align:center;font-size:66px;line-height:.9;font-weight:900;letter-spacing:1px;color:#0f1b3d;
  text-shadow:0 3px 0 rgba(255,255,255,.8),0 8px 16px rgba(15,27,61,.25)}
.title em{font-style:normal;color:#ff5a3c}
.chips{display:flex;gap:10px;justify-content:center;margin-top:16px}
.chip{background:rgba(15,27,61,.85);border-radius:999px;padding:8px 15px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.coinDot{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #b8741a;
  background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc72c 60%,#d9951a)}
.menuBottom{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.how{margin:4px 0 0;font-size:15px;font-weight:800;color:#0f1b3d;text-shadow:0 1px 0 rgba(255,255,255,.7);text-align:center}

.dim{background:rgba(8,14,38,.66);justify-content:center;gap:14px}
.dim h2{margin:0 0 6px;font-size:34px;font-weight:900}
.card{width:340px;background:#14224d;border-radius:26px;padding:20px 18px 18px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25);margin-bottom:6px}
.fell{font-size:26px;font-weight:800}
.fell b{font-size:44px;color:#ffc72c;font-weight:900;display:inline-block;margin-left:4px}
.badge{display:inline-block;margin-top:6px;background:#ffc72c;color:#3b2a00;font-weight:900;padding:5px 14px;border-radius:999px;font-size:15px;letter-spacing:1px;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.stats{display:flex;justify-content:space-around;margin-top:14px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats small{color:#9fb0ea;font-weight:700;font-size:13px}
.stats b{font-size:24px;font-weight:900}
.token{margin-top:16px}
.token .btn{width:100%}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#ffc72c}

#shop{justify-content:flex-start}
.shopTop{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 14px 0;flex:none}
.shopPrev{height:196px;flex:none}
.panel{flex:1;width:100%;min-height:0;background:rgba(15,27,61,.96);border-radius:26px 26px 0 0;padding:12px 12px 0;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;min-height:46px;border:0;border-radius:12px;background:#1d2b5a;color:#aab6e8;font-weight:800;font-size:14px;cursor:pointer}
.tab.on{background:#ff5a3c;color:#fff}
.list{flex:1;overflow-y:auto;margin-top:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.item{display:flex;align-items:center;gap:12px;background:#16244f;border-radius:16px;padding:9px 10px;margin-bottom:8px}
.item canvas{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.08);flex:none}
.info{flex:1;min-width:0}
.info b{display:block;font-size:16px}
.info small{color:#aab6e8;font-size:12px;font-weight:600}
.buy{min-width:88px;min-height:46px;border:0;border-radius:12px;font-weight:900;font-size:15px;background:#ffc72c;color:#3b2a00;cursor:pointer}
.buy.owned{background:#2d8f5e;color:#fff}
.buy.eq{background:#fff;color:#0f1b3d}
.buy.max{background:#3a4a85;color:#c9d3ff}
.item.dim2{opacity:.5}
.item.dim2 .buy{filter:grayscale(.8)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <button id="btnPause" class="ico hidden" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg></button>

  <div id="menu" class="screen">
    <button id="btnMuteM" class="ico mute" aria-label="Sound"></button>
    <div style="width:100%">
      <h1 class="title">TOWER<br><em>HOP</em></h1>
      <div class="chips"><span class="chip">Best <b id="mBest">0</b></span><span class="chip"><i class="coinDot"></i><b id="mCoins">0</b></span></div>
    </div>
    <div class="menuBottom">
      <button id="btnPlay" class="btn big">PLAY</button>
      <div class="row"><button id="btnShop" class="btn">Shop</button><button id="btnWard" class="btn">Wardrobe</button></div>
      <p class="how">Arrows steer, JUMP button jumps.<br>Press JUMP just as you land = BOOST.</p>
      <button id="btnAssistM" class="btn">Timing assist: On</button>
    </div>
  </div>

  <div id="pause" class="screen dim hidden">
    <h2>PAUSED</h2>
    <button id="btnResume" class="btn big">RESUME</button>
    <div class="row"><button id="btnRestart" class="btn">Restart</button><button id="btnQuit" class="btn">Quit to Menu</button></div>
    <button id="btnMuteP" class="btn">Sound: On</button>
    <button id="btnAssistP" class="btn">Timing assist: On</button>
  </div>

  <div id="over" class="screen dim hidden">
    <div class="card">
      <div class="fell">You fell at Floor <b id="oFloor">0</b></div>
      <div id="oNew" class="badge hidden">NEW BEST!</div>
      <div class="stats">
        <div><small>Best</small><b id="oBest">0</b></div>
        <div><small>Coins earned</small><b id="oCoins">0</b></div>
        <div><small>Best combo</small><b id="oCombo">x0</b></div>
      </div>
      <div id="tokenBox" class="token hidden"><button id="btnToken" class="btn gold">Use Token?</button><div class="bar"><i id="tokBar"></i></div></div>
    </div>
    <button id="btnAgain" class="btn big">PLAY AGAIN</button>
    <button id="btnMenu" class="btn">Menu</button>
  </div>

  <div id="shop" class="screen hidden">
    <div class="shopTop">
      <button id="btnBack" class="btn" style="min-height:48px;padding:0 18px">&#8249; Back</button>
      <span class="chip"><i class="coinDot"></i><b id="sCoins">0</b></span>
    </div>
    <div class="shopPrev"></div>
    <div class="panel">
      <div class="tabs" id="tabs">
        <button class="tab" data-tab="up">Upgrades</button>
        <button class="tab" data-tab="colors">Colors</button>
        <button class="tab" data-tab="hats">Hats</button>
        <button class="tab" data-tab="trails">Trails</button>
      </div>
      <div class="list scroll" id="shopList"></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   TOWER HOP - single-file build.
   Sections: TUNING, STATE, SAVE/LOAD, INPUT, SPAWNING, PHYSICS, CAMERA,
             RENDER, AUDIO, UI/SCREENS, MAIN LOOP
   Controls (decided with Scott): NO charging. Left side = two ARROW buttons (steer), right side = one big JUMP button.
   - JUMP jumps at once. Hold an arrow while pressing JUMP to aim that jump left/right (neither = straight up).
   - WHEN you press JUMP sets the power: press as you touch down (assist on: 70 ms early / 70 ms late) for a BOOST.
     A second perfect press in a row is a MEGA BOOST, then the count resets (no chained megas).
   - In the air, hold an arrow to steer: this is how you place MEGA jumps.
   Desktop: Left/Right (A/D) = arrows, Space / Up / W = jump.
   ===================================================================== */

/* ============================== TUNING ============================== */
const W = 420, H = 740;                 // logical canvas size, scaled to fit any screen
const TUNING = {
  // ---- jump physics (units/s, units/s^2) ----
  GRAVITY: 2600,       // snappy fall; Bop feels heavy, not floaty
  JUMP_MIN: 860,       // the plain jump (mistimed tap). SPEC CHANGE (spec said 620): 620 -> apex 74 which cannot clear the
                       // 95-125 row gap; 860 -> apex ~142 so even a lazy tap clears every row.
  JUMP_MAX: 1180,      // a perfectly timed tap: BOOST, apex ~268 (2 rows)
  MEGA_MULT: 1.45,     // 2+ perfectly timed taps in a row: MEGA BOOST, apex ~560 (5 rows)
  TIME_EARLY: 0.07,    // ASSIST ON: a tap up to 70 ms BEFORE touchdown is buffered and counts as perfectly timed
  TIME_PERFECT_LATE: 0.07, // ...and so does a tap up to 70 ms AFTER touchdown
  TIME_EARLY_HARD: 0.045,  // ASSIST OFF (no ring): the perfect window is +/-45 ms
  TIME_PERFECT_LATE_HARD: 0.045,
  TIME_FADE: 0.50,     // later than that the bonus fades linearly to nothing by 0.5 s (waiting = plain jump)
  FUMBLE_CAP: 0.55,    // tapping too early / mashing in the air caps that jump's timing bonus (no button-mash exploit)
  AIM_RANGE: 210,      // tap position sets how far sideways you land on the NEXT row (max at the screen edge)
  AIM_GAP: 108,        // fallback row gap for aiming when there is no platform above
  STEER_ACCEL: 1800,   // air steering while a side is held (any time you are airborne)
  STEER_MAX: 340,      // max horizontal speed from steering
  MASH_GAP: 0.30,      // two presses within 0.3 s in the same flight = mashing: that jump's timing bonus is capped
  WALL_KEEP: 0.70,     // wall bounce keeps 70% of horizontal speed
  COYOTE: 0.09,        // jump still works 90 ms after the platform leaves you (crumble / moving edge)
  LAND_FORGIVE: 6,     // 6 px of body overlap counts as landed (edge saves)
  PERFECT_RANGE: 12,   // within 12 units of platform centre = PERFECT (+1 coin)
  BOP_W: 36, BOP_H: 32,
  // ---- combo ----
  COMBO_WINDOW: 2.5,   // combo counter: land on a HIGHER platform within 2.5 s
  // ---- camera ----
  CAM_RAMP: [[0,55],[30,75],[100,105],[200,140],[350,175],[500,210]], // u/s by floor (cap 210)
  REMIX_SPEED: 0.05,   // +5% camera speed per full 5-zone loop (from floor 500)
  CATCHUP_MAX: 0.30,   // camera speeds up to +30% when Bop is in the top third
  CAM_TOP_MARGIN: 44,  // PLAYABILITY: Bop is never allowed above this margin; camera is pushed up if needed
  RELIEF_TIME: 8,      // after a Second Chance respawn the camera eases from zone-base speed back to normal
  // ---- platform generation ----
  WIDTH_MIN: [[0,125],[30,120],[100,105],[200,90],[350,75]],
  WIDTH_MAX: [[0,150],[30,145],[100,135],[200,115],[350,100]],
  GAP_MIN:   [[0,95],[200,100],[350,110]],      // vertical row gap 95-125 (spec)
  GAP_MAX:   [[0,105],[100,115],[350,125]],
  MAX_OFFSET:[[0,95],[30,115],[100,140],[200,160],[350,180],[500,190]], // max centre-to-centre sideways step
  MOVE_FROM: 35, BOUNCY_FROM: 60, CRUMBLE_FROM: 120, NARROW_FROM: 180,
  CRUMBLE_TIME: 0.6,
  BOUNCE_MULT: 1.25,   // bouncy platform launches at 125% of max jump
  COIN_ARC_P: 0.6,     // chance a risky gap gets a 3-coin arc
  // ---- shop effects ----
  SHOE_STEP: 0.04, LENS_STEP: 0.05, MAGNET_BASE: 34, MAGNET_STEP: 46,
  TOKEN_PRICE: 200, TOKEN_MAX: 2
};
const T = TUNING;
const STEP = 1 / 120;           // fixed physics step (frame-rate independent: 60/120/144 Hz all behave the same)
const PH = 14;                  // platform thickness (visual)
const HW = T.BOP_W / 2;

/* ============================== UTIL ============================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
let rand = Math.random;   // TODO(V1 daily seed): swap in a seeded PRNG here so everyone climbs the same tower
const rr = (a, b) => a + rand() * (b - a);
function ramp(pts, f) {
  if (f <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (f <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return lerp(a[1], b[1], (f - a[0]) / (b[0] - a[0])); }
  }
  return pts[pts.length - 1][1];
}
const easeOutBack = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };

/* ============================== CATALOG ============================== */
const COLORS = [
  { id: 'coral', name: 'Coral', price: 0, c: '#FF5A3C' },
  { id: 'mint', name: 'Mint', price: 30, c: '#47D6A2' },
  { id: 'grape', name: 'Grape', price: 40, c: '#8E5BD6' },
  { id: 'lemon', name: 'Lemon', price: 50, c: '#FFD93C' },
  { id: 'midnight', name: 'Midnight', price: 80, c: '#3B4FA8' },
  { id: 'rainbow', name: 'Rainbow', price: 500, c: null }
];
const HATS = [
  { id: 'cap', name: 'Cap', price: 60 },
  { id: 'party', name: 'Party Hat', price: 90 },
  { id: 'frog', name: 'Tiny Frog', price: 120 },
  { id: 'crown', name: 'Crown', price: 160 },
  { id: 'halo', name: 'Halo', price: 200 }
];
const TRAILS = [
  { id: 'sparkles', name: 'Sparkles', price: 100 },
  { id: 'bubbles', name: 'Bubbles', price: 150 },
  { id: 'stars', name: 'Stars', price: 200 },
  { id: 'flame', name: 'Flame', price: 250 }
];
const UPS = {
  spring: { name: 'Spring Shoes', prices: [50, 120, 250], desc: l => '+' + (4 * (l || 1)) + '% jump power per level' },
  lens:   { name: 'Wide Lens',    prices: [50, 120, 250], desc: l => 'Camera starts 5% slower per level' },
  magnet: { name: 'Magnet',       prices: [75, 150, 300], desc: l => 'Coins pull in from farther away' }
};

/* ============================== SAVE / LOAD ============================== */
const SAVE_KEY = 'towerhop_v1';
const winE = () => save.assist ? T.TIME_EARLY : T.TIME_EARLY_HARD, winL = () => save.assist ? T.TIME_PERFECT_LATE : T.TIME_PERFECT_LATE_HARD;
function defaultSave() {
  return { best: 0, coins: 0, owned: { colors: ['coral'], hats: [], trails: [] },
    eq: { color: 'coral', hat: 'none', trail: 'none' }, up: { spring: 0, lens: 0, magnet: 0 },
    tokens: 0, mute: false, assist: true, runs: 0, falls: 0, bestCombo: 0 };
}
function loadSave() {
  const d = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        const n = (v, def) => (typeof v === 'number' && isFinite(v) && v >= 0) ? Math.floor(v) : def;
        d.best = n(o.best, 0); d.coins = n(o.coins, 0); d.runs = n(o.runs, 0); d.falls = n(o.falls, 0);
        d.bestCombo = n(o.bestCombo, 0); d.tokens = Math.min(T.TOKEN_MAX, n(o.tokens, 0)); d.mute = !!o.mute; if (typeof o.assist === 'boolean') d.assist = o.assist;
        if (o.owned) for (const k of ['colors', 'hats', 'trails']) if (Array.isArray(o.owned[k])) d.owned[k] = o.owned[k].filter(x => typeof x === 'string');
        if (!d.owned.colors.includes('coral')) d.owned.colors.push('coral');
        if (o.eq) for (const k of ['color', 'hat', 'trail']) if (typeof o.eq[k] === 'string') d.eq[k] = o.eq[k];
        if (o.up) for (const k of ['spring', 'lens', 'magnet']) d.up[k] = Math.min(3, n(o.up[k], 0));
      }
    }
  } catch (e) { /* private mode / blocked storage: play without saving */ }
  if (!d.owned.colors.includes(d.eq.color)) d.eq.color = 'coral';
  if (d.eq.hat !== 'none' && !d.owned.hats.includes(d.eq.hat)) d.eq.hat = 'none';
  if (d.eq.trail !== 'none' && !d.owned.trails.includes(d.eq.trail)) d.eq.trail = 'none';
  return d;
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }

/* ============================== STATE ============================== */
const S = {
  mode: 'menu',            // menu | play | dying | over | pause | shop
  runTime: 0, vt: 0,       // sim time of the run / visual time (always ticking)
  camY: 0, floor: 0, coins: 0, committedCoins: 0,
  combo: 0, bestCombo: 0, lastLandId: -1, lastLandT: 0, lastLandY: 0,
  zone: 0, palT: 1, flashT: 0, titleT: 0, titleText: '', popT: 0,
  shakeT: 0, deathReal: 0, tokenUsed: false, tokenT: 0, overT: 0, prevBest: 0, newBest: false,
  reliefT: 99, shopTab: 'up', lastPausedAt: 0
};
const B = {                 // Bop
  x: 210, y: 260, vx: 0, vy: 0, grounded: true, plat: null, platVx: 0, coyote: 0,
  chain: 0, fumbled: false, aim: 0, landT: -99,
  sqT: 9, stT: 9, wallT: 9, trailAcc: 0
};
const POSE = { sx: 1, sy: 1 };

/* ---- pools (no allocation inside the game loop) ---- */
const PLATS = [], COINS = [], PARTS = [], TEXTS = [], SHAPES = [];
for (let i = 0; i < 56; i++) PLATS.push({ a: false, id: 0, x: 0, y: 0, w: 0, t: 0, row: 0, bx: 0, A: 0, w0: 0, ph: 0, vx: 0, crT: -1, cloud: false });
for (let i = 0; i < 140; i++) COINS.push({ a: false, x: 0, y: 0, ph: 0, ring: -1 });
for (let i = 0; i < 240; i++) PARTS.push({ a: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, type: 0, size: 3, col: '#fff', g: 0 });
for (let i = 0; i < 10; i++) TEXTS.push({ a: false, x: 0, y: 0, life: 0, max: 1, s: '', size: 20, col: '#fff' });
for (let i = 0; i < 18; i++) SHAPES.push({ x: Math.random() * W, y: Math.random() * (H + 160), s: 14 + Math.random() * 34, k: 0.12 + Math.random() * 0.4, r: Math.random() });
const ringGot = new Uint8Array(16);
let platSerial = 1, ringSerial = 0;

/* ---- palettes: 20 colours each = sky top/bot, shape, shape2, shadow, then fill/dark/edge for 5 platform types ---- */
function hexA(h) { if (Array.isArray(h)) return h; const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255, 1]; }
function mkPal(a) { return a.map(hexA); }
const BASE_PALS = [
  // 0 SKY - daylight, navy platforms (like the spec art)
  mkPal(['#6FBFF7', '#F7E8C8', '#FFFFFF', '#CFE6F8', [10, 25, 60, .33],
    '#22305C', '#121B3A', '#4A5C94',   // normal
    '#2F6FD6', '#1B428A', '#8FBBFF',   // moving
    '#25C26E', '#13804A', '#A6F5C8',   // bouncy
    '#9C6B4E', '#5E3C28', '#DDAA86',   // crumbling
    '#5B3FA8', '#35226B', '#B7A0FF']), // narrow
  // 1 SUNSET
  mkPal(['#F0679B', '#FFC27A', '#FFD6E0', '#C2456F', [60, 10, 50, .38],
    '#3B1F54', '#220F33', '#9A66C2',
    '#1E7FA8', '#0F4F6B', '#86DDF7',
    '#2BC48A', '#16805A', '#A9F6D6',
    '#A5654A', '#5F3626', '#E8B090',
    '#7A1E52', '#4A0F31', '#FF9AC6']),
  // 2 NIGHT - light platforms for contrast
  mkPal(['#080D2B', '#1F2E66', '#FFFFFF', '#FFF3B0', [5, 10, 50, .5],
    '#B9C6FF', '#6C7FC4', '#F2F5FF',
    '#79E0FF', '#3AA3C4', '#E6FAFF',
    '#FFE066', '#C9A21E', '#FFF7C9',
    '#D9B28A', '#8E6B48', '#F8E3CB',
    '#FFB3E6', '#C06FA3', '#FFE6F7']),
  // 3 SPACE - dark slabs with neon edges
  mkPal(['#03020D', '#2B0F55', '#9B5CFF', '#00F5D4', [0, 245, 212, .35],
    '#161236', '#0A0820', '#00F5D4',
    '#2A0F4A', '#150727', '#FF4FD8',
    '#142F2A', '#081A17', '#B7FF3C',
    '#3A1A12', '#1E0C08', '#FF8A3D',
    '#2A1030', '#150818', '#FFE600']),

/* ============================== SPAWNING ============================== */
const SP = { row: 0, y: 260, lastBx: 210, lastA: 0, lastType: 0, cloudCool: 0 };
const rowY = new Float32Array(128);   // ring buffer: y of each row (floor counting needs it even after a platform breaks)
function allocPlat() { for (let i = 0; i < PLATS.length; i++) if (!PLATS[i].a) return PLATS[i]; return null; }
function allocCoin() { for (let i = 0; i < COINS.length; i++) if (!COINS[i].a) return COINS[i]; return null; }
function addCoinAt(x, y, ring) { const c = allocCoin(); if (!c) return; c.a = true; c.x = x; c.y = y; c.ph = rand() * 6.28; c.ring = ring; }

function resetSpawner() {
  for (let i = 0; i < PLATS.length; i++) PLATS[i].a = false;
  for (let i = 0; i < COINS.length; i++) COINS[i].a = false;
  const p = allocPlat();
  p.a = true; p.id = platSerial++; p.x = p.bx = 210; p.y = 260; p.w = 360; p.t = 0; p.row = 0; p.A = 0; p.vx = 0; p.crT = -1; p.cloud = false;
  rowY[0] = 260;
  SP.row = 0; SP.y = 260; SP.lastBx = 210; SP.lastA = 0; SP.lastType = 0; SP.cloudCool = 0;
  return p;
}

function spawnRow() {
  const p = allocPlat(); if (!p) return false;
  const row = SP.row + 1, f = row;
  let type = 0;
  const bnd = row % 100, forced = (bnd === 99 || bnd === 0 || bnd === 1);   // guaranteed normal platform around every zone boundary
  if (!forced) {
    if (row === T.MOVE_FROM) type = 1;            // each type debuts on an exact floor, one at a time
    else if (row === T.BOUNCY_FROM) type = 2;
    else if (row === T.CRUMBLE_FROM) type = 3;
    else if (row === T.NARROW_FROM) type = 4;
    else {
      const r = rand(); let acc = 0;
      const pm = f >= T.MOVE_FROM ? lerp(0.14, 0.30, clamp((f - 35) / 65, 0, 1)) : 0;
      const pb = f >= T.BOUNCY_FROM ? 0.09 : 0;
      const pc = f >= T.CRUMBLE_FROM ? lerp(0.12, 0.24, clamp((f - 120) / 180, 0, 1)) : 0;
      const pn = f >= T.NARROW_FROM ? lerp(0.12, 0.26, clamp((f - 180) / 200, 0, 1)) : 0;
      if (r < (acc += pm)) type = 1; else if (r < (acc += pb)) type = 2; else if (r < (acc += pc)) type = 3; else if (r < (acc += pn)) type = 4;
    }
    // never two crumbling / two narrow in a row before floor 200; never two bouncy in a row
    if (type !== 0 && type === SP.lastType && (type === 2 || ((type === 3 || type === 4) && f < 200))) type = 0;
  }
  const maxOff = ramp(T.MAX_OFFSET, f);
  const w = type === 4 ? rr(45, 60) : rr(ramp(T.WIDTH_MIN, f), ramp(T.WIDTH_MAX, f));

  const lo = w / 2 + 12 + A, hi = W - w / 2 - 12 - A;
  const room = Math.max(15, maxOff - A - SP.lastA);
  const sign = rand() < 0.5 ? -1 : 1;
  let bx = SP.lastBx + sign * rr(0.25, 1) * room;
  if (bx < lo || bx > hi) bx = SP.lastBx - sign * rr(0.25, 1) * room;
  bx = clamp(bx, lo, hi);
  const prevY = SP.y, prevBx = SP.lastBx;

  p.a = true; p.id = platSerial++; p.t = type; p.row = row; p.w = w; p.bx = bx; p.A = A; p.w0 = w0; p.ph = ph;
  p.x = bx + A * Math.sin(ph + w0 * S.runTime); p.y = y; p.vx = 0; p.crT = -1; p.cloud = false;

  if (Math.abs(bx - prevBx) >= 105 && rand() < T.COIN_ARC_P) {
    for (let k = 1; k <= 3; k++) {
      const u = k / 4;
      addCoinAt(lerp(prevBx, bx, u), lerp(prevY, y, u) + 26 + 62 * Math.sin(Math.PI * u), -1);

}
function recycle() {

/* ============================== PHYSICS ============================== */
function leaveGround() { B.grounded = false; B.coyote = T.COYOTE; B.plat = null; }

// place whether the jump is plain, boosted or mega (flight time to the next row is computed from the real gap).

  const fumbled = b.fumbled;
  if (fumbled && q > T.FUMBLE_CAP) q = T.FUMBLE_CAP;

function land(p) {
  const b = B, impact = -b.vy, now = S.runTime;
  b.y = p.y; b.vy = 0; b.grounded = true; b.plat = p; b.platVx = p.vx; b.coyote = 0; b.sqT = 0; b.landT = now;

function stepPlatforms(dt) {

    if (!p.a) continue;
    if (prevY >= p.y - 0.001 && B.y <= p.y && Math.abs(B.x - p.x) <= p.w / 2 + HW - T.LAND_FORGIVE) { if (!best || p.y > best.y) best = p; }
  }

function stepPlayer(dt) {

  if (b.grounded) {
    const p = b.plat;
    if (!p || !p.a || Math.abs(b.x - p.x) > p.w / 2 + HW - T.LAND_FORGIVE + 0.5) leaveGround();
  }
  if (!b.grounded && b.coyote > 0) b.coyote -= dt;

      doJump(inp.tapAim, early ? -1 : inp.tapT - b.landT);

  }
}
$('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) { S.shopTab = t.dataset.tab; sfxClick(); renderShop(); } });
$('shopList').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const [kind, a, c] = b.dataset.act.split(':');
  if (kind === 'up') {
    const lvl = save.up[a], price = UPS[a].prices[lvl];
    if (lvl < 3 && save.coins >= price) { save.coins -= price; save.up[a]++; sfxPerfect(); }
  } else if (kind === 'token') {
    if (save.tokens < T.TOKEN_MAX && save.coins >= T.TOKEN_PRICE) { save.coins -= T.TOKEN_PRICE; save.tokens++; sfxPerfect(); }
  } else if (kind === 'buy') {
    const cat = a === 'colors' ? COLORS : a === 'hats' ? HATS : TRAILS, it = cat.find(x => x.id === c);
    if (it && !save.owned[a].includes(c) && save.coins >= it.price) {
      save.coins -= it.price; save.owned[a].push(c); save.eq[a === 'colors' ? 'color' : a === 'hats' ? 'hat' : 'trail'] = c; sfxPerfect();   // auto-equip on purchase
    }
  } else if (kind === 'equip') {
    const key = a;                                  // 'color' | 'hat' | 'trail'
    if (key === 'color' || save.eq[key] !== c) { save.eq[key] = c; sfxClick(); }
    else if (key !== 'color') { save.eq[key] = 'none'; sfxClick(); }
  }
  persist(); renderShop();
});

/* ============================== MAIN LOOP ============================== */
let last = 0, accum = 0;
function update(dt) {
  S.vt += dt;
  if (S.mode === 'play') {
    accum += dt; let n = 0;
    while (accum >= STEP && n < 14) { stepPlay(STEP); accum -= STEP; n++; if (S.mode !== 'play') break; }
    if (n >= 14) accum = 0;
  } else if (S.mode === 'dying') {
    S.deathReal += dt; accum += dt * 0.3; let n = 0;                 // brief slow-motion: 0.3 s at 30% speed
    while (accum >= STEP && n < 14) { stepPlay(STEP); accum -= STEP; n++; }
    if (S.deathReal >= 0.3) showGameOver();
  } else if (S.mode === 'over') {
    S.overT += dt;
    if (S.tokenT > 0) {
      S.tokenT -= dt; $('tokBar').style.width = (clamp(S.tokenT / 3, 0, 1) * 100).toFixed(1) + '%';
      if (S.tokenT <= 0) show($('tokenBox'), false);
    }
  }
}
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;       // delta time: identical speed on 60 / 120 / 144 Hz screens
  update(dt); render();
}
function resize() {
  const iw = window.innerWidth, ih = window.innerHeight, s = Math.min(iw / W, ih / H);
  $('stage').style.transform = 'translate(' + ((iw - W * s) / 2).toFixed(2) + 'px,' + ((ih - H * s) / 2).toFixed(2) + 'px) scale(' + s + ')';
  let dpr = Math.min(window.devicePixelRatio || 1, 2), pw = W * s * dpr, ph = H * s * dpr;
  if (pw * ph > 2.6e6) { const k = Math.sqrt(2.6e6 / (pw * ph)); pw *= k; ph *= k; }
  cv.width = Math.max(2, Math.round(pw)); cv.height = Math.max(2, Math.round(ph));
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', resize);
resize();

   TODO(V2): challenge mode (Floor 200 in under X jumps), weekly tower, friend leaderboard via share codes.
   TODO(audio): optional looping music per zone ("music / sound palette").                                   */
setMode('menu');
requestAnimationFrame(frame);

/* ---- PWA: register the offline service worker ---- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}
